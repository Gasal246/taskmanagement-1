# Include inside the existing HTTPS server{} block (not inside location{}).
# Keep the site's existing TLS, authentication and other proxy locations.
location = /api/task/activity-files {
    # 10 MiB documents plus multipart overhead; app validation remains stricter.
    client_max_body_size 11m;
    client_body_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Match the upstream address/port used by this site's existing location /.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_intercept_errors off;
}
